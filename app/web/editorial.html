<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio de contenu · Atelier éditorial</title>
<style>
:root{font-family:system-ui,sans-serif;color:#272720;background:#f6f4ee;line-height:1.5}*{box-sizing:border-box}body{margin:0}header{padding:22px 32px;background:#222923;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:23px;margin:0}header small{color:#c4d0c5}nav{display:flex;gap:8px;padding:18px 32px;border-bottom:1px solid #ddd}button,a.button{font:inherit;cursor:pointer;border:1px solid #b8bcae;border-radius:8px;padding:9px 16px;background:#fff;color:#222;text-decoration:none}button.primary{background:#305a43;color:#fff;border-color:#305a43}button:disabled{opacity:.45;cursor:not-allowed}nav button.active{background:#305a43;color:#fff}main{max-width:1200px;padding:24px 30px;margin:auto}h2{font-size:24px;margin:0 0 12px}h3{font-size:18px}p{margin:10px 0}section,.card{background:white;border:1px solid #dfe1d5;border-radius:12px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}.muted{color:#62685b}.status{display:inline-block;font-size:13px;padding:3px 9px;background:#edf1e9;border-radius:12px}.warn{background:#fff3db;border-left:4px solid #ad7731;padding:14px;border-radius:5px}.error{color:#982e2e}.success{color:#305a43}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}label{display:block;font-size:14px;font-weight:600;margin:14px 0 5px}input,textarea,select{font:inherit;width:100%;padding:9px;border:1px solid #bfc5b8;border-radius:6px;background:white}textarea{min-height:90px;resize:vertical}input[type=checkbox]{width:auto;margin-right:8px}.checklabel{font-weight:400;display:flex;align-items:flex-start;gap:8px}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #e1e4d8;padding:12px}th{font-size:13px;color:#62685b}details{margin:10px 0}summary{cursor:pointer}pre{white-space:pre-wrap;font:inherit;font-size:14px;padding:10px;background:#f5f6ef;max-height:400px;overflow:auto}.notice{position:sticky;top:0;background:#f6f4ee;padding:8px 30px;z-index:10;min-height:30px}.beat{border-left:3px solid #8a9e86;padding:4px 15px;margin:18px 0}video{max-width:100%;height:560px;background:#222;border-radius:8px}.asset{width:100%;max-height:170px;object-fit:contain;background:#f3f4ec}.breadcrumbs{margin-bottom:18px}.compact{font-size:13px}.subhead{display:flex;justify-content:space-between;gap:16px;align-items:center}a{color:#305a43}footer{padding:24px 32px;font-size:13px;color:#62685b}.empty{padding:32px;text-align:center;color:#62685b}@media(max-width:700px){header,nav{padding:16px}header{display:block}main{padding:16px}table{font-size:13px}td,th{padding:6px}video{height:420px}nav{flex-wrap:wrap}}
</style></head><body>
<header><div><h1>Studio de contenu · Atelier éditorial</h1><small>Une idée, des sources, un contenu. Publication supervisée.</small></div><div id="headerStatus"></div></header>
<nav aria-label="Parcours"><a class="button" href="/review">Votre studio ↗</a><button data-tab="daily">À choisir</button><button data-tab="reserve">Réserve</button><button data-tab="stories">Récits</button><button data-tab="studio">Atelier Reel</button><button id="refresh">Actualiser les étapes</button></nav>
<div id="message" class="notice" role="status" aria-live="polite"></div><main id="content"></main><footer>Les sources, vos décisions et chaque version sont conservées localement. Aucun envoi vers un service payant ni publication automatique.</footer>
<script>
let state, tab='daily', placeId=null, projectId=null, storyPlaceId=null, busy=false, dirty=false, formDirty=false;
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={pending:'Arbitrage ouvert',deepen:'À approfondir',retained:'Intérêt retenu',rejected:'Rejeté',verified:'Contrôlé',unresolved:'À contrôler',contradicted:'Contradiction',not_applicable:'Hors périmètre'};
const pointNames={identity_location:'Identité / localisation',access_booking:'Accès / réservation',menu_prices:'Carte / prix',experience:'Expérience / appréciations',history_people:'Histoire / personnes',opening_program:'Ouverture / programme'};
function message(text,error=false){$('#message').textContent=text;$('#message').className='notice '+(error?'error':'success')}
async function load(renderPage=true){const r=await fetch('/api/state');state=await r.json();if(!r.ok)throw Error(state.error);$('#headerStatus').textContent=`Choix du ${state.day.day} → ${state.day.publication_day}`;if(renderPage&&!dirty&&!formDirty)render()}
async function action(route,payload){if(busy)return;busy=true;try{const r=await fetch('/api/'+route,{method:'POST',headers:{'Content-Type':'application/json','X-Operator-Token':state.token},body:JSON.stringify(payload)});const result=await r.json();if(!r.ok)throw Error(result.error);message('Étape enregistrée.');dirty=false;formDirty=false;await load();return result}catch(e){message(e.message,true)}finally{busy=false}}
function openPlace(id){if((dirty||formDirty)&&!confirm('Quitter les corrections non enregistrées ?'))return;dirty=false;formDirty=false;placeId=id;tab='dossier';render()}
function openProject(id){projectId=id;tab='studio';dirty=false;render()}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const root=$('#content');if(tab==='daily')root.innerHTML=daily();if(tab==='reserve')root.innerHTML=reserve();if(tab==='dossier')root.innerHTML=dossier();if(tab==='studio')root.innerHTML=studio();if(tab==='stories')root.innerHTML=stories();bind()}
function card(p){return `<div class="card"><span class="status">${esc(labels[p.owner_interest])}</span><h3>${esc(p.name)}</h3><p>${esc(p.reason)}</p><p class="muted compact">${esc(p.scope)} · ${p.timing==='durable'?'Adresse durable, actualité non requise':esc(p.timing)}</p><p class="compact">${esc(p.owner_note)}</p><div class="actions"><button data-place="${esc(p.id)}">Ouvrir le dossier</button></div></div>`}
function daily(){const d=state.day;const choice=state.dossiers.flatMap(p=>p.choices).find(c=>c.choice_id===d.choice);const selected=state.dossiers.find(p=>p.choices.some(c=>c.choice_id===d.choice));return `<h2>À choisir · ${esc(d.publication_day)}</h2><p class="muted">${d.proposals.length} lieux distincts à départager. Un Reel prévu au lancement.</p>${d.gap?`<div class="warn">Il manque ${d.gap} lieu(x) utile(s). Confirmez une piste sourcée en réserve ; aucun remplissage automatique.</div>`:''}${selected?`<section><h3>Votre choix : ${esc(selected.place.name)}</h3><p>${choice.remaining_points.length} point(s) factuel(s) restant(s).</p><button data-place="${esc(selected.place.id)}">Vérifier le dossier</button></section>`:''}<div class="grid">${d.proposals.map(card).join('')}</div><details><summary>Pistes exclues des propositions (${Object.keys(d.excluded).length})</summary>${Object.entries(d.excluded).map(([id,why])=>`<p><button data-place="${esc(id)}">${esc(state.dossiers.find(x=>x.place.id===id)?.place.name)}</button> ${esc(why.join(' '))}</p>`).join('')}</details>`}
function stories(){const list=state.prepared_stories||[];const selected=list.find(v=>v.place_id===storyPlaceId);if(selected){const p=state.dossiers.find(d=>d.place.id===selected.place_id).place;return `<button data-tab="stories" id="allStories">← Tous les récits</button><h2>${esc(p.name)} · récit à relire</h2><p>${esc(selected.draft.angle)}</p>${selected.stale?'<p class="warn">Le dossier ou ses sources ont changé. Revoir ce récit avant utilisation.</p>':''}<p class="muted">Préparation de l’assistant. Les faits, le texte et les images restent à vérifier.</p>${selected.audition?`<section><h3>Essai de voix à écouter</h3><audio controls preload="metadata" src="${fileUrl(selected.audition.audio_path)}"></audio><p class="compact">${selected.audition.duration.toFixed(1)} s · ${selected.audition.status==='ready_to_listen'?'contrôles techniques réussis':'prise à revoir'} · naturel et prononciation à écouter.</p></section>`:''}<section><h3>Texte parlé</h3>${selected.draft.beats.map((b,i)=>`<div class="beat"><strong>Passage ${i+1}</strong><p>${esc(b.text)}</p>${b.visual_intent?`<p class="compact muted">Image souhaitée : ${esc(b.visual_intent)}. Disponibilité à vérifier.</p>`:''}<details><summary>Extraits liés à ce passage</summary>${(b.evidence||[]).map(e=>`<p class="compact">${esc(pointNames[e.point]||e.point)} : ${esc(e.quote)} ${p.sources.find(s=>s.id===e.source_id)?.url?.startsWith('https://')?`<a href="${esc(p.sources.find(s=>s.id===e.source_id).url)}" target="_blank" rel="noopener">Voir la source</a>`:''}</p>`).join('')||'<p>Aucune affirmation factuelle déclarée dans ce passage ; à relire.</p>'}</details></div>`).join('')}<h3>Légende</h3><p style="white-space:pre-wrap">${esc(selected.draft.caption)}</p></section><section><h3>Points de revue</h3><p>Le rapprochement des extraits ne vérifie ni leur interprétation ni l’actualité des faits.</p>${selected.review.editorial_concerns.map(c=>`<p>${esc(c)}</p>`).join('')}<p>${esc(selected.draft.notice||'')}</p><button data-place="${esc(p.id)}">Ouvrir le dossier du lieu</button></section>`}return `<h2>Récits préparés · ${list.length}</h2><p class="muted">Comparer des angles et des textes avant de choisir un lieu pour publication.</p><div class="grid">${list.map(v=>{const p=state.dossiers.find(d=>d.place.id===v.place_id).place;return `<section><h3>${esc(p.name)}</h3><span class="status">${v.stale?'Dossier modifié · à reprendre':'À relire'}</span><p>${esc(v.draft.angle)}</p><p>${esc(v.draft.beats[0].text)}</p><button data-story="${esc(v.place_id)}">Lire le récit</button></section>`}).join('')||'<p>Les récits sourcés préparés par l’assistant apparaîtront ici.</p>'}</div><details><summary>État documentaire des ${state.dossiers.length} lieux</summary>${(state.writing_readiness||[]).map(v=>`<p><strong>${esc(state.dossiers.find(d=>d.place.id===v.place_id).place.name)}</strong> : ${v.readiness==='documented_unverified'?`${v.external_document_count} document(s) acquis, faits à vérifier`:v.readiness==='preferences_only'?'goûts documentés ; sources factuelles à compléter':'preuves absentes ou modifiées'}</p>`).join('')}</details>`}
function reserve(){return `<h2>Réserve · ${state.dossiers.length} lieux</h2><p class="muted">Les dix lieux de calibration conservent vos goûts documentés. Leur présence ici ne les choisit ni ne vérifie les faits.</p><table><thead><tr><th>Lieu</th><th>Intérêt propriétaire</th><th>Origine</th><th>Dossier</th></tr></thead><tbody>${state.dossiers.map(d=>`<tr><td><strong>${esc(d.place.name)}</strong><div class="compact muted">${esc(d.place.scope)}</div></td><td>${esc(labels[d.place.owner_interest])}<div class="compact">${esc(d.place.owner_note)}</div></td><td>${esc(d.place.origin==='owner_calibration'?'Vos goûts documentés':d.place.origin==='editor_suggestion'?'Votre suggestion':'Découverte assistant')}</td><td><button data-place="${esc(d.place.id)}">Consulter</button></td></tr>`).join('')}</tbody></table>`}
function dossier(){const d=state.dossiers.find(x=>x.place.id===placeId);if(!d)return '<p>Dossier inconnu.</p>';const p=d.place;const choice=d.choices.find(c=>c.choice_id===state.day.choice)||[...d.choices].reverse().find(c=>c.active&&!c.current_blockers.length);const preparedStory=(state.prepared_stories||[]).find(v=>v.place_id===p.id);const eligible=state.day.proposals.some(x=>x.id===p.id)&&!state.day.gap;return `<div class="breadcrumbs"><button data-tab="reserve">← Réserve</button></div><h2>${esc(p.name)}</h2><p>${esc(p.scope)}</p>${preparedStory?`<section><h3>${preparedStory.stale?'Récit à reprendre':'Récit préparé à relire'}</h3><p>${esc(preparedStory.draft.angle)}</p><button data-story="${esc(p.id)}">Lire le récit préparé</button></section>`:p.owner_interest==='rejected'?'':'<p class="muted">Recherche et récit à compléter avant de préparer un script.</p>'}<div class="grid"><section><h3>Intérêt éditorial</h3><span class="status">${esc(labels[p.owner_interest])}</span><p>${esc(p.owner_note)}</p><p>${esc(p.reason)}</p><p class="muted compact">Visite : inconnue. Aucun témoignage personnel déduit.</p><form id="interest"><label for="interestDecision">Votre décision</label><select id="interestDecision">${['pending','retained','deepen','rejected'].map(k=>`<option value="${k}" ${k===p.owner_interest?'selected':''}>${esc(labels[k])}</option>`).join('')}</select><label for="interestNote">Votre motif</label><textarea id="interestNote" required></textarea><button class="primary">Enregistrer l'intérêt</button></form></section><section><h3>Choix de publication</h3><p>Jour prévu : ${state.day.publication_day}</p><form id="choose"><label for="choiceNote">Votre motif de choix</label><textarea id="choiceNote" required></textarea><button class="primary" ${eligible?'':'disabled'}>Choisir pour J+2</button></form>${!eligible?'<p class="warn compact">Intérêt confirmé, preuves intactes et deux propositions distinctes requis.</p>':''}${choice?`<p>Choix enregistré · ${esc(choice.publication_day)}</p><button id="makeDraft">${state.projects.some(x=>x.id===choice.choice_id)?'Reprendre le Reel':'Proposer angle, script et légende'}</button>${choice.choice_id===state.day.choice?'<button id="cancelChoice">Annuler ce choix</button>':''}`:''}</section></div><section><h3>Sources et limites</h3>${p.sources.map(s=>`<p><strong>${esc(s.family||'Source')}</strong> · ${esc(s.acquired_at)} · ${esc(d.source_status[s.id])}<br>${/^https?:/.test(s.url)?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a>`:esc(s.url)}<br><span class="compact">${esc(s.independence||'Indépendance non établie.')}</span> <button class="evidence" data-source="${esc(s.id)}">Lire la preuve</button></p>`).join('')}<pre id="evidenceText" hidden></pre>${p.assistant_review.note?`<details><summary>Avis assistant distinct</summary><p>${esc(p.assistant_review.note)}</p><p class="compact">Plan ${esc(p.assistant_review.plan_fingerprint)}</p></details>`:''}</section><section><h3>Vérifications du choix</h3>${choice?`<p class="muted">Contrôlez chaque point. Les points absents du futur Reel peuvent être écartés avec motif, sauf identité et accès.</p>${Object.entries(p.points).map(([point,description])=>`<details><summary>${esc(pointNames[point])} · ${esc(labels[choice.latest_checks[point]?.result||'unresolved'])}</summary><p>${esc(description)}</p>${choice.latest_checks[point]?`<p class="compact">${esc(choice.latest_checks[point].note)} · ${esc(choice.latest_checks[point].source)} · ${esc(choice.latest_checks[point].checked_at)}</p>`:''}<form class="factcheck" data-point="${point}"><label>Résultat<select name="result">${['unresolved','verified','contradicted',...(p.required_points.includes(point)?[]:['not_applicable'])].map(k=>`<option value="${k}">${esc(labels[k])}</option>`).join('')}</select></label><label>Source réellement consultée<input name="source" required placeholder="Google Maps, site du lieu, note personnelle attribuée…"></label><label>Date réelle du contrôle (avec fuseau)<input name="checked_at" required placeholder="2026-10-14T15:30:00+02:00"></label><label>Ce que vous avez contrôlé / motif hors périmètre<textarea name="note" required></textarea></label><button>Enregistrer ce point</button></form></details>`).join('')}`:'<p>Choisissez ce lieu avant de contrôler les points pour ce Reel.</p>'}</section><details><summary>Historique du lieu (${d.history.length} actes)</summary>${d.history.map(e=>`<p class="compact">${esc(e.recorded_at)} · ${esc(e.role)} / ${esc(e.actor)} · ${esc(e.kind)} ${esc(e.payload.note||'')}</p>`).join('')}</details>`}
function studio(){if(!projectId&&state.day.choice&&state.projects.some(p=>p.id===state.day.choice))projectId=state.day.choice;const choices=state.dossiers.flatMap(d=>d.choices.map(c=>({...c,name:d.place.name})));if(!projectId||!state.projects.some(p=>p.id===projectId))return `<h2>Atelier Reel</h2><p>Un format vertical, une sélection visuelle de l’assistant à vérifier, le profil vocal Martin à écouter sur chaque prise.</p><div class="grid">${state.projects.map(p=>`<section><h3>${esc(p.content.title)}</h3><p>${state.dossiers.flatMap(d=>d.choices).find(c=>c.choice_id===p.id)?.current_blockers.length?'Choix historique · ':''}Version ${p.content.version} · ${p.approval?'texte approuvé':'texte à revoir'}</p><button data-project="${p.id}">Reprendre</button></section>`).join('')||'<section class="empty">Choisissez un lieu, puis ouvrez sa proposition depuis le dossier.</section>'}</div>`;const p=state.projects.find(p=>p.id===projectId),d=state.dossiers.find(d=>d.place.id===p.place_id),run=p.runs.at(-1),choice=d.choices.find(c=>c.choice_id===p.id);return `<div class="subhead"><div><h2>${esc(p.content.title)} · Reel</h2><p class="muted">Version ${p.content.version} · ${p.approval?'Approbation enregistrée':'Approbation humaine en attente'}</p></div><div class="actions">${run?.video?'<a class="button" href="#renderedReel">Voir le Reel produit</a>':''}<a class="button" href="#visualLot">Voir le lot photos / vidéos</a><button data-place="${p.place_id}">Dossier & vérifications</button></div></div>${choice.current_blockers.length?`<div class="warn">${esc(choice.current_blockers.join(' '))}</div>`:''}<section><h3>1. Angle, script et légende</h3><p class="muted">Proposition à relire pour son intérêt et son rythme. Chaque passage doit faire avancer le récit. Reliez les affirmations aux points et aux sources correspondantes. Aucune visite ne doit être inventée.</p><form id="editDraft"><label for="angle">Angle</label><textarea id="angle">${esc(p.draft.angle)}</textarea><div id="beatFields">${p.draft.beats.map((b,i)=>beatEditor(b,i,d)).join('')}</div><button type="button" id="addBeat">Ajouter un segment</button><label for="caption">Légende</label><textarea id="caption">${esc(p.draft.caption)}</textarea><label>Points utilisés dans la légende</label>${Object.keys(d.place.points).map(k=>`<label class="checklabel"><input type="checkbox" class="captionPoint" value="${k}" ${p.draft.used_points.includes(k)?'checked':''}>${esc(pointNames[k])}</label>`).join('')}<div class="actions"><button>Enregistrer mes corrections</button></div></form><form id="approveScript"><label class="checklabel"><input type="checkbox" required>J'approuve l'angle, tous les segments et la légende affichés, avec leurs affirmations.</label><label for="approvalNote">Note d'approbation</label><input id="approvalNote" required><button class="primary" id="approvalButton" ${choice.scoped_checks_complete?'':'disabled'}>Approuver cette version</button>${!choice.scoped_checks_complete?`<p class="warn">Vérifications encore ouvertes : ${esc(choice.remaining_points.map(k=>pointNames[k]).join(', '))}.</p>`:''}</form></section><section><h3 id="visualLot">2. Lot photos / vidéos et production</h3>${visualLot(p)}${visualResearch(p)}<p class="muted">L’assistant recherche et choisit les visuels du lieu. Vérifiez leur correspondance au récit et le recadrage vertical dans le rendu. Vous pouvez compléter la sélection avec vos propres fichiers si vous le souhaitez.</p>${p.draft.beats.map((b,i)=>{const a=p.assets[String(i)];return `<div class="beat"><strong>Segment ${i+1}</strong><p>${esc(b.text)}</p>${a?`${a.type==='IMAGE'?`<img class="asset" src="${fileUrl(a.file_path)}" alt="Visuel du segment ${i+1}">`:`<video class="asset" controls src="${fileUrl(a.file_path)}"></video>`}<p class="compact">${esc(a.metadata.source?'Sélection assistant à vérifier':a.metadata.filename)} · ${esc(a.metadata.provenance)}${a.metadata.source?`<br><a href="${esc(a.metadata.source.page_url)}" target="_blank" rel="noopener">Source du visuel</a>`:''}</p>`:''}<details><summary>Compléter avec un de vos fichiers (facultatif)</summary><form class="upload" data-beat="${i}"><label>Fichier<input name="visual" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime" required></label><label>Origine / ce que ce visuel montre<input name="provenance" required></label><button>Fournir ce visuel</button></form></details></div>`}).join('')}<p>Voix : profil Martin · narration continue et longues pauses ajustées · chaque nouvelle prise reste à écouter. ${state.preflight.ready?'Installation disponible.':`Manquant : ${esc(state.preflight.missing.join(', '))}`}</p><button id="preview" ${p.visual_lot?.complete&&state.preflight.ready?'':'disabled'}>Produire une version de travail</button><button id="produce" class="primary" ${p.approval&&p.visual_lot?.approved&&p.visual_lot?.complete&&state.preflight.ready?'':'disabled'}>Produire / reprendre le montage</button>${run?`<p id="runStatus">Montage : ${esc(run.status)} · ${esc(run.stage)}</p>${run.error?`<div class="warn">${esc(run.error)}</div>`:''}`:''}</section>${run?.video?`<section><h3 id="renderedReel">3. ${run.mode==='preview'?'Version de travail à regarder':'Contrôle du résultat'}</h3>${run.mode==='preview'?`<p class="warn">Maquette produite à votre demande : faits, texte et médias non validés pour publication.</p><a class="button" href="${fileUrl(run.video,true)}">Télécharger la version de travail</a>`:''}<video controls preload="metadata" src="${fileUrl(run.video)}"></video><p>Contrôle technique : ${run.technical.passed?'réussi':'échec'} · ${run.technical.duration.toFixed(1)} s</p>${!run.technical.passed?`<p class="warn">À corriger : ${esc(Object.entries(run.technical.checks).filter(([k,v])=>!v).map(([k])=>k).join(', '))}</p>`:''}${run.mode==='preview'?'<p>Après revue : corriger le dossier, le texte ou les médias puis enregistrer les accords pour un rendu de publication.</p>':`<form id="videoQa">${Object.entries(state.qa_points).map(([k,text])=>`<label class="checklabel"><input type="checkbox" name="${k}">${esc(text)}</label>`).join('')}<label for="qaNote">Votre revue / corrections nécessaires</label><textarea id="qaNote" required></textarea><div class="actions"><button name="passed" value="yes" class="primary">Valider ce résultat</button><button name="passed" value="no">Demander une correction</button></div></form>${run.qa?`<p>Dernière revue : ${run.qa.passed?'validé':'à corriger'} · ${esc(run.qa.note)}</p>`:''}<h3>4. Export pour publication manuelle</h3><button id="export" class="primary" ${run.qa?.passed&&run.technical.passed?'':'disabled'}>Exporter vidéo + légende</button>${p.exports.map(e=>`<div class="actions">${['reel.mp4','caption.txt','subtitles.srt'].map(name=>`<a class="button" href="${fileUrl('projects/'+p.id+'/exports/'+e.run_id+'/'+name,true)}">Télécharger ${name==='reel.mp4'?'la vidéo':name==='caption.txt'?'la légende':'les sous-titres'}</a>`).join('')}</div>`).join('')}`}</section>`:''}<details><summary>Versions et étapes conservées (${p.history.length})</summary>${p.history.map(e=>`<p class="compact">${esc(e.recorded_at)} · ${esc(e.actor)} · ${esc(e.kind)}</p>`).join('')}</details>`}
function visualLot(p){const lot=p.visual_lot;if(!lot)return '';const custom=p.visual_plan?.some(s=>s.shots);return `<h4>Lot prévu pour le montage · ${lot.photos} photo(s), ${lot.videos} vidéo(s) distinctes</h4><p>${lot.complete?'Tous les plans sont renseignés, revue éditoriale en attente.':'Lot incomplet : recherche à poursuivre par l’assistant. Les emplacements vides ne seront pas remplis avec les deux mêmes photos.'} ${lot.approved?'Votre accord sur ce lot est enregistré.':''}</p>${p.visual_lot_notice?`<p class="warn">${esc(p.visual_lot_notice)}</p>`:''}<div class="grid">${lot.slots.map(s=>`<section><strong>${custom?'Visuel':'Plan'} ${s.beat+1} · ${s.target.kind==='VIDEO'?'Vidéo':s.target.kind==='IMAGE'?'Photo':'Photo ou vidéo'}</strong>${custom?'':`<p>${esc(s.target.subject)}</p><p class="compact">${esc(s.text)}</p>`}${s.asset?`${s.asset.type==='VIDEO'?`<video class="asset" controls preload="metadata" src="${fileUrl(s.asset.file_path)}"></video>`:`<img class="asset" src="${fileUrl(s.asset.file_path)}" alt="Plan ${s.beat+1}">`}<p class="compact">${esc(s.asset.metadata.provenance)}</p>${s.asset.type==='VIDEO'?`<p class="compact">Extrait : ${s.asset.metadata.source.clip_in}–${s.asset.metadata.source.clip_out} s · son original écarté.</p>`:'<p class="compact">Photo tenue sur la durée de la voix ; mouvement selon les réglages du montage.</p>'}<a href="${fileUrl(s.asset.file_path)}" target="_blank">Voir l’original entier</a>${s.asset.metadata.source?.page_url?` · <a href="${esc(s.asset.metadata.source.page_url)}" target="_blank" rel="noopener">Provenance</a>`:''}`:''}${s.gap?`<p class="warn">${esc(s.gap)}</p>`:''}${s.source_quality?`<p class="compact">Source : ${s.source_quality.width}×${s.source_quality.height} · ${esc(s.source_quality.label)} · cadrage ${s.source_quality.crop_width}×${s.source_quality.crop_height}${s.source_quality.sharpness_reviewed?' · netteté inspectée':' · netteté à inspecter'}${s.source_quality.upscale_to_output>1?' · agrandi '+s.source_quality.upscale_to_output.toFixed(2)+'× vers 1080p':''}</p>`:''}<p class="compact muted">${custom?'Durée fixée par le découpage et la voix.':`Durée estimée : ${s.estimated_seconds} s ; fixée après la voix.`} Recadrage central 9:16.</p></section>`).join('')}</div>${p.visual_plan?.some(s=>s.shots)?`<h4>Découpage des images</h4><p>Les mêmes fichiers peuvent revenir à plusieurs moments. La voix et les sous-titres restent continus.</p><div class="grid">${p.visual_plan.flatMap((s,i)=>(s.shots||[{asset_beat:i}]).map(shot=>({passage:i,asset:p.assets[String(shot.asset_beat)],source:shot.asset_beat}))).map((s,i)=>`<section><strong>Plan ${i+1} · passage ${s.passage+1}</strong>${s.asset?.type==='IMAGE'?`<img class="asset" src="${fileUrl(s.asset.file_path)}" alt="Visuel du plan ${i+1}">`:''}<p class="compact">Visuel ${s.source+1} · ${esc(s.asset?.metadata.provenance||'À compléter')}</p></section>`).join('')}</div>`:''}${p.visual_plan_alternatives?.length?`<details><summary>Piste avec vidéos conservée, encore incomplète</summary>${p.visual_plan_alternatives.map(v=>`<p>${esc(v.reason)}</p>${v.slots.map((s,i)=>`<p class="compact">Plan ${i+1} · ${esc(s.kind)} · ${esc(s.subject)}${v.missing_beats.includes(i)?' · clip manquant':''}</p>`).join('')}`).join('')}</details>`:''}<div class="actions"><button id="packageLot">Préparer le lot à télécharger</button>${(p.visual_packages||[]).filter(v=>v.signature===lot.signature&&v.schema_version===2).map(v=>`<a class="button" href="${fileUrl(v.file_path,true)}">Télécharger tous les médias + provenance</a>`).join('')}</div><form id="lotReview"><label for="lotNote">Votre contrôle du lot / corrections</label><textarea id="lotNote" required></textarea><div class="actions"><button name="passed" value="yes" ${lot.complete?'':'disabled'}>Approuver ces médias et ce découpage</button><button name="passed" value="no">Demander une correction du lot</button></div></form>${p.visual_lot_approval?`<p>${p.visual_lot_approval.passed?'Lot approuvé':'Corrections demandées'} : ${esc(p.visual_lot_approval.note)}</p>`:''}`}
function visualResearch(p){
 const runs=p.visual_research||[],byId=new Map();runs.forEach(r=>r.candidates.forEach(c=>byId.set(c.id,c)));
 const all=[...byId.values()],accepted=all.filter(c=>p.visual_reviews?.[c.id]?.decision==='accepted'),others=all.filter(c=>p.visual_reviews?.[c.id]?.decision!=='accepted');
 const card=c=>`<section>${c.media_type==='VIDEO'?`<video class="asset" controls preload="metadata" src="${fileUrl(c.file_path)}"></video>`:`<img class="asset" src="${fileUrl(c.file_path)}" alt="${esc(c.label||'Candidat à identifier')}"/>`}<p>${esc(c.label||'Identité à confirmer')}</p><p class="status">${esc(p.visual_reviews?.[c.id]?.decision==='accepted'?(Object.values(p.assets).some(a=>a.metadata.source?.id===c.id)?'Prévu dans le montage':'Alternative, non utilisée'):p.visual_reviews?.[c.id]?.decision==='rejected'?'Écarté assistant':'Non inspecté')}</p><p class="compact">${esc(p.visual_reviews?.[c.id]?.note||'Aucune validation présumée.')}</p><p class="compact">${c.width} × ${c.height} · ${c.media_type==='VIDEO'?'Vidéo · '+c.duration+' s':'Photo'}<br>Acquis le ${esc(c.date)} · prise de vue ${esc(c.capture_date||'non établie')}${c.displayed_date?`<br>Date affichée par la galerie : ${esc(c.displayed_date)} (prise de vue non attestée)`:''}<br>Crédit : ${esc(c.credit||'non établi')}<br>${c.rendered_ui_observed?'Galerie observée dans le navigateur ; preuve NOTE, pas copie HTML.':c.page_acquired===false?'Page originale non acquise ; résultat d’index public.':'Page source conservée localement.'}</p><a href="${fileUrl(c.file_path)}" target="_blank">Voir le fichier entier</a> · <a href="${esc(c.page_url)}" target="_blank" rel="noopener">Page source</a></section>`;
 return `<h4>Lot de recherche entier</h4><p>${all.length} fichiers acquis ; ${accepted.length} retenus ou alternatives. Seuls les fichiers associés aux plans ci-dessus sont prévus dans le montage.</p><div class="grid">${accepted.map(card).join('')}</div><details><summary>Comparer les ${others.length} rejets et candidats non inspectés</summary><div class="grid">${others.map(card).join('')}</div></details>${p.visual_leads?.length?`<details><summary>Publications repérées, indisponibles pour le montage</summary>${p.visual_leads.map(l=>`<p class="compact"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a> · ${esc(l.status)} · non utilisée</p>`).join('')}</details>`:''}<button id="sourceVisuals" ${['queued','running'].includes(p.sourcing_status)?'disabled':''}>Rechercher les visuels du lieu</button><p>${p.sourcing_status?esc('Recherche : '+p.sourcing_status):''} · ${runs.reduce((n,r)=>n+r.pages.length,0)} page(s) conservée(s).</p><details><summary>Échecs d’accès et médias inadéquats</summary>${runs.flatMap(r=>r.failures).map(f=>`<p class="compact">${esc(f.url)} · ${esc(f.reason)}</p>`).join('')}</details>`
}
function fileUrl(path,download=false){return '/files?path='+encodeURIComponent(path)+(download?'&download=1':'')}
function beatEditor(b,i,d){return `<div class="beat editorBeat"><label>Segment ${i+1}<textarea class="beatText">${esc(b.text)}</textarea></label><p class="compact muted">Points factuels utilisés par ce segment :</p>${Object.keys(d.place.points).map(k=>`<label class="checklabel compact"><input type="checkbox" class="beatPoint" value="${k}" ${b.points.includes(k)?'checked':''}>${esc(pointNames[k])}</label>`).join('')}<details><summary>Sources de ce passage</summary>${d.place.sources.map(source=>`<label class="checklabel compact"><input type="checkbox" class="beatSource" value="${esc(source.id)}" ${(b.source_ids||[]).includes(source.id)?'checked':''}>${esc(source.family||source.url)}</label>`).join('')}</details><button type="button" class="removeBeat">Retirer ce segment</button></div>`}
function bind(){document.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>{storyPlaceId=b.dataset.story;tab='stories';render()});if($('#allStories'))$('#allStories').onclick=()=>{storyPlaceId=null;tab='stories';render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if((dirty||formDirty)&&!confirm('Quitter les corrections non enregistrées ?'))return;dirty=false;formDirty=false;tab=b.dataset.tab;if(tab==='stories')storyPlaceId=null;load().catch(e=>message(e.message,true))});document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>openPlace(b.dataset.place));document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>openProject(b.dataset.project));
 if(tab==='dossier'){const d=state.dossiers.find(x=>x.place.id===placeId),choice=d.choices.find(c=>c.choice_id===state.day.choice)||[...d.choices].reverse().find(c=>c.active&&!c.current_blockers.length);$('#interest').onsubmit=e=>{e.preventDefault();action('interest',{place:placeId,decision:$('#interestDecision').value,note:$('#interestNote').value})};$('#choose').onsubmit=async e=>{e.preventDefault();await action('choose',{place:placeId,note:$('#choiceNote').value})};if($('#makeDraft'))$('#makeDraft').onclick=async()=>{const result=await action('draft',{choice:choice.choice_id});if(result)openProject(choice.choice_id)};if($('#cancelChoice'))$('#cancelChoice').onclick=()=>{const note=prompt('Motif de votre annulation');if(note)action('cancel',{note})};document.querySelectorAll('.factcheck').forEach(f=>f.onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(f));action('check',{...data,choice:choice.choice_id,point:f.dataset.point})});document.querySelectorAll('.evidence').forEach(b=>b.onclick=async()=>{try{const r=await fetch('/api/evidence?place='+encodeURIComponent(placeId)+'&source='+encodeURIComponent(b.dataset.source));const data=await r.json();if(!r.ok)throw Error(data.error);$('#evidenceText').hidden=false;$('#evidenceText').textContent=data.text}catch(e){message(e.message,true)}})}
 if(tab==='studio'&&$('#editDraft')){const p=state.projects.find(p=>p.id===projectId),d=state.dossiers.find(x=>x.place.id===p.place_id);$('#editDraft').oninput=()=>{dirty=true;$('#approvalButton').disabled=true;message('Corrections non enregistrées : enregistrez-les avant approbation.')};document.querySelectorAll('.removeBeat').forEach(b=>b.onclick=()=>{b.closest('.editorBeat').remove();dirty=true;$('#approvalButton').disabled=true});$('#addBeat').onclick=()=>{const list=$('#beatFields');list.insertAdjacentHTML('beforeend',beatEditor({text:'',points:[]},list.children.length,d));dirty=true;$('#approvalButton').disabled=true;bind()};$('#editDraft').onsubmit=e=>{e.preventDefault();const draft={...p.draft,angle:$('#angle').value,caption:$('#caption').value,used_points:[...document.querySelectorAll('.captionPoint:checked')].map(x=>x.value),beats:[...document.querySelectorAll('.editorBeat')].map(b=>({text:b.querySelector('.beatText').value,points:[...b.querySelectorAll('.beatPoint:checked')].map(x=>x.value),source_ids:[...b.querySelectorAll('.beatSource:checked')].map(x=>x.value)}))};action('edit',{choice:p.id,draft})};$('#approveScript').onsubmit=e=>{e.preventDefault();if(dirty)return message('Enregistrez d’abord vos corrections.',true);action('approve',{choice:p.id,note:$('#approvalNote').value})};document.querySelectorAll('.upload').forEach(f=>f.onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{const file=f.elements.visual.files[0],q=new URLSearchParams({choice:p.id,beat:f.dataset.beat,name:file.name,provenance:f.elements.provenance.value});const r=await fetch('/api/upload?'+q,{method:'POST',headers:{'X-Operator-Token':state.token},body:file});const result=await r.json();if(!r.ok)throw Error(result.error);message('Visuel enregistré.');formDirty=false;await load()}catch(e){message(e.message,true)}finally{busy=false}});$('#produce').onclick=()=>action('produce',{choice:p.id});$('#preview').onclick=()=>action('preview',{choice:p.id,instruction:'Je demande une version de travail complète de ce texte et de ces médias pour juger le rendu, sans attester les faits ni valider la publication.'});if($('#sourceVisuals'))$('#sourceVisuals').onclick=()=>action('source',{choice:p.id});if($('#packageLot'))$('#packageLot').onclick=()=>action('visual_lot_package',{choice:p.id});if($('#lotReview'))$('#lotReview').onsubmit=e=>{e.preventDefault();action('visual_lot_review',{choice:p.id,note:$('#lotNote').value,passed:e.submitter.value==='yes',signature:p.visual_lot.signature})};const run=p.runs.at(-1);if($('#videoQa'))$('#videoQa').onsubmit=e=>{e.preventDefault();const checks=Object.fromEntries(Object.keys(state.qa_points).map(k=>[k,e.target.elements[k].checked]));action('qa',{choice:p.id,run:run.id,checks,note:$('#qaNote').value,passed:e.submitter.value==='yes'})};if($('#export'))$('#export').onclick=()=>action('export',{choice:p.id,run:run.id})}}
$('#refresh').onclick=()=>{if((dirty||formDirty)&&!confirm('Quitter les champs non enregistrés ?'))return;dirty=false;formDirty=false;load().catch(e=>message(e.message,true))};$('#content').addEventListener('input',e=>{if(e.target.closest('#editDraft'))dirty=true;else formDirty=true});load().catch(e=>message(e.message,true));setInterval(async()=>{if(state?.projects.some(p=>['queued','running'].includes(p.sourcing_status)||p.runs.some(r=>['queued','running'].includes(r.status)))&&!busy){try{await load()}catch(e){message(e.message,true)}}},4000);
</script></body></html>
