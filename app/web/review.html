const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),file=p=>'/files?path='+encodeURIComponent(p);

async function hydrate(item,protect=false,request=null){

setInterval(async()=>{

  const r=await fetch('/api/review/updates');if(!r.ok)return;const next=await r.json();
  if(reviewBusy()||epoch!==navigationEpoch)return;

  state.immediate_engine=next.immediate_engine;

   const r2=await fetch('/api/review'),fresh=await r2.json();if(!r2.ok||reviewBusy()||epoch!==navigationEpoch)return;
   const previous=selected,previousState=state;state=fresh;

function productionRequestPanel(){
 const eligible=(state.dossiers||[]).filter(d=>d.place.owner_interest!=='rejected'&&!workflowCards().some(i=>i.place===d.place.id&&['validated','published'].includes(i.stage)));
 return `<details class="quiet-section"><summary>Préparer une nouvelle proposition</summary><p>La même chaîne traite les demandes du chat et du studio. Les photos sont vérifiées avant la voix ; les versions validées sont préservées.</p><form id="productionForm"><label for="productionPlace">Lieu</label><select id="productionPlace">${eligible.map(d=>`<option value="${esc(d.place.id)}">${esc(d.place.name)}</option>`).join('')}</select><label for="productionInstruction">Direction souhaitée</label><textarea id="productionInstruction" required maxlength="5000" placeholder="L’angle, les détails à mettre en avant…"></textarea><button class="primary" ${eligible.length?'':'disabled'}>Préparer la proposition</button></form>${(state.immediate_tasks||[]).filter(t=>t.request_type==='production').slice(-5).reverse().map(t=>`<p><strong>${esc(name(t.place_id))}</strong> · ${esc(t.message)}${['blocked','interrupted','waiting_connection'].includes(t.status)?` <button data-retry="${esc(t.id)}">Reprendre</button>`:''}</p>`).join('')}</details>`;
}
let productionAttempt=null;
async function requestProduction(event){
 event.preventDefault();if(saving)return;saving=true;
 const data={place:$('#productionPlace').value,instruction:$('#productionInstruction').value},signature=JSON.stringify(data);
 if(!productionAttempt||productionAttempt.signature!==signature)productionAttempt={signature,payload:{...data,request_key:crypto.randomUUID()}};
 const payload=productionAttempt.payload;
 try{await postAction('/api/production',payload);productionAttempt=null;dirty=false;await load();notice('Demande enregistrée dans la chaîne. La proposition sera disponible après production et revue.')}catch(error){notice(error.message,true)}finally{saving=false}
}
function referencesPage(){const c=state.reference_coverage;const statuses={running:'L’analyse se poursuit sur ce Mac.',interrupted:'L’analyse est interrompue. Les résultats sont conservés.',bounded_stop:'Cette session d’analyse est terminée.',inventory_pass_finished:'Tous les éléments accessibles ont été parcourus.',stopped_after_three_consecutive_errors_or_review_flags:'L’analyse attend une revue des derniers résultats.'};return `<section class="page-intro"><h1>Vos références</h1><p>Suivre les références configurées du projet, avec une couverture explicite.</p></section>${c?.dimensions?`<div class="reference-list">${Object.entries(c.dimensions).map(([label,row])=>`<div class="reference-row"><div class="reference-label"><span>${esc(label)}</span><strong>${esc(row.done??'—')} <span class="muted">/ ${esc(row.total??'—')}</span></strong></div>${Number.isFinite(row.done)&&row.total>0?`<progress value="${Math.min(row.done,row.total)}" max="${row.total}" aria-label="${esc(label)}"></progress>`:''}${row.note?`<p>${esc(row.note)}</p>`:''}</div>`).join('')}</div><div class="reference-note"><p>${esc(statuses[c.run?.status]||'Les résultats disponibles sont conservés.')}</p><p>${c.statuses?.needs_review||0} résultat(s) à revoir · ${c.statuses?.missing_video||0} média(s) manquant(s) · ${c.statuses?.restricted||0} accès restreint(s).</p><details><summary>Comprendre ces repères</summary><p>Les analyses automatiques ne remplacent ni l’écoute ni la revue éditoriale.</p><p>${esc(c.limitations||'')}</p><p>Relevé du ${esc(new Date(c.observed_at).toLocaleString('fr-FR'))}.</p></details></div>`:'<p class="empty">La couverture des références sera affichée ici dès qu’elle sera disponible.</p>'}${(state.benchmark_insights||[]).length?'<section class="quiet-section"><h2>Enseignements à tester</h2>'+state.benchmark_insights.map(r=>`<p><strong>${esc(r.mechanism)}</strong><br>${esc(r.experiment)}<br><small>${esc(r.limits)} · hypothèse à confirmer</small></p>`).join('')+'</section>':''}`}

function correctionFields(i){return `<details><summary>Localiser la correction</summary><label for="category">Sujet du retour</label><select id="category"><option value="other">Autre ou ensemble</option value="text">Texte</option><option value="pronunciation">Prononciation</option><option value="rhythm">Rythme / silence</option><option value="music">Musique</option><option value="image">Image</option></select><label for="correctionBeat">Passage (facultatif)</label><input id="correctionBeat" type="number" min="1" max="${(i.story?.draft||i.run?.inputs?.draft)?.beats.length||12}"><label for="correctionSeconds">Instant en secondes (facultatif)</label><input id="correctionSeconds" type="number" min="0" step="0.1"><label for="diagnosis">Après plusieurs essais : cause observée et résultat attendu</label><textarea id="diagnosis" maxlength="3000"></textarea></details>`}
function correctionValue(){return $('#category')?{category:$('#category').value,beat:$('#correctionBeat').value?Number($('#correctionBeat').value):null,seconds:$('#correctionSeconds').value?Number($('#correctionSeconds').value):null,diagnosis:$('#diagnosis').value}:null}
function comparisonPlayer(i,choices){return `<p class="muted">Les boutons utilisent le lecteur du récit, au même instant. Après la fin, l’écoute reprend au début.</p><button type="button" data-compare="${esc(i.story.audition.audio_path)}">Voix seule</button>`}
function previewTime(time,duration,ended=false){return ended||!Number.isFinite(time)||!Number.isFinite(duration)||time>=duration-.5?0:Math.max(0,time)}
function playPreview(player){
 if(player.isConnected===false)return;
 document.querySelectorAll('audio,video').forEach(p=>{if(p!==player)p.pause()});mediaTouched=true;
 const result=player.play();if(result?.catch)result.catch(e=>{if(e.name!=='AbortError')notice('Lecture interrompue. Appuyez sur lecture pour reprendre.',true)});
}
function switchPreview(button){
 const player=$('#reviewAudio')||button.closest('.panel')?.querySelector('audio');if(!player||!button.dataset.compare)return;
 const time=player.dataset.switching?Number(player.dataset.resumeTime):previewTime(player.currentTime,player.duration,player.ended);
 const volume=player.volume,src=file(button.dataset.compare);mediaTouched=true;
 const label=document.querySelector('.media-panel [data-player-label]');if(label)label.textContent='Écoute : '+button.textContent.replace(/^Écouter /,'proposition ').toLocaleLowerCase('fr');
 if(player.getAttribute('src')===src&&!player.dataset.switching){player.currentTime=time;playPreview(player);return}
 player.pause();player.dataset.switching='1';player.dataset.resumeTime=String(time);
 player.onloadedmetadata=()=>{
  player.onloadedmetadata=null;delete player.dataset.switching;delete player.dataset.resumeTime;
  player.currentTime=previewTime(time,player.duration);player.volume=volume;playPreview(player);
 };
 player.onerror=()=>{player.onloadedmetadata=null;delete player.dataset.switching;delete player.dataset.resumeTime;notice('Le fichier audio n’a pas pu être chargé. Réessayez avec le bouton d’écoute.',true)};
 player.src=src;player.load();
}
function bindMediaPlayers(){
 document.querySelectorAll('audio,video').forEach(player=>{
  player.onplay=()=>{mediaTouched=true;document.querySelectorAll('audio,video').forEach(p=>{if(p!==player)p.pause()})};
  player.onerror=()=>notice('Le fichier audio ou vidéo n’a pas pu être chargé. Réessayez.',true);
 });
}

function qualityPanel(i){const q=state.detail?.quality;if(!q)return '';const sections=q.annotations?.sections||{};return `<section class="panel"><h2>Qualité et préparation</h2><p>Contrôle technique : ${q.technical_status?.passed?'réussi':'à consulter'}. ${q.kind==='run'?'La sélection et le montage demandent aussi une revue artistique de la vidéo complète.':'Le sens des faits et le naturel de la voix demandent une revue distincte.'}</p><details><summary>Charte active et mémoire appliquée</summary>${(state.editorial_memory?.[i.place]?.entries||[]).map(r=>`<p>${esc(r.instruction)}<br><small>${esc(r.scope==='general'?'Tous les récits':'Ce lieu')} · ${esc(r.category||'retour éditorial')}</small></p>`).join('')}<p>Révision ${esc(q.charter_version.slice(0,12))}</p></details><details><summary>${q.kind==='run'?'Sélection, montage et récit':'Grille du récit et prononciations'}</summary>${q.editorial_grid.map(r=>`<p>${esc(r.question)} · ${esc((sections.editorial||[]).find(x=>x.id===r.id)?.status||'à relire')}</p>`).join('')}${q.pronunciations.map(r=>`<p>${esc(r.written)} → ${esc(r.spoken)} · à écouter</p>`).join('')}</details><details><summary>Storyboard · ${q.storyboard.length} plans documentés</summary>${q.storyboard.length?q.storyboard.map((r,k)=>`<p>Plan ${k+1} · passage ${esc(r.beat||'?')} · ${esc(r.source||(typeof r.asset==='object'?r.asset?.metadata?.provenance:'')||'Provenance à préciser')}</p>`).join(''):'<p>Associer chaque passage à une image exacte, son cadrage, sa provenance et son statut d’utilisation avant le montage.</p>'}</details><details><summary>Faits et droits d’utilisation</summary>${q.facts.map(r=>`<p><strong>Passage ${r.beat}</strong> : ${esc(r.claim)}<br><small>${esc((sections.facts||[]).find(x=>x.id===r.id)?.status||'Non vérifié')} · ${esc(r.evidence.quote||'')}</small></p>`).join('')}<p>La provenance d’un média ne vaut pas autorisation. Préciser le mode d’utilisation de la musique : piste intégrée ou ajout dans l’application.</p>${Object.entries(sections).filter(([k])=>k!=='editorial').flatMap(([k,rows])=>rows.map(r=>`<p>${esc(k)} · ${esc(r.id)} · ${esc(r.status)} : ${esc(r.note||'')}</p>`)).join('')}</details>${generationPanel(q)}${chainPanel()}${state.detail.archived?'':`<details><summary>Consigner un contrôle pour cette version</summary><form id="qualityForm"><label for="qualitySection">Rubrique</label><select id="qualitySection"><option value="editorial">Qualité éditoriale</option><option value="facts">Fait utilisé</option><option value="rights">Médias / musique</option><option value="storyboard">Storyboard</option></select><label for="qualityId">Élément contrôlé</label><select id="qualityId">${q.editorial_grid.map(r=>`<option value="${esc(r.id)}">${esc(r.question)}</option>`).join('')}${q.facts.map(r=>`<option value="${r.id}">Fait du passage ${r.beat} : ${esc(r.claim)}</option>`).join('')}<option value="music">Musique et mode d’utilisation</option><option value="images">Images et cadrages</option></select><label for="qualityStatus">Résultat</label><select id="qualityStatus"><option value="pending">À vérifier</option><option value="verified">Vérifié par moi</option><option value="rejected">À corriger</option><option value="not_applicable">Sans objet pour cette version</option></select><label for="qualityNote">Constat précis</label><textarea id="qualityNote" required maxlength="5000"></textarea><label for="qualitySource">Source ou document du contrôle</label><input id="qualitySource" type="text" maxlength="5000"><label for="qualityDate">Date du contrôle</label><input id="qualityDate" type="date"><button class="primary">Enregistrer ce contrôle</button></form></details>`}</section>`}
function publicationFields(metadata={}){return `<label for="publicationUrl">Lien de la publication (si disponible)</label><input id="publicationUrl" type="url" value="${esc(metadata.url||'')}" placeholder="https://…"><label for="publicationDate">Date et heure de publication</label><input id="publicationDate" type="datetime-local"><label for="publicationPlatform">Plateforme</label><input id="publicationPlatform" value="${esc(metadata.platform||'Instagram')}">`}
function publicationMetadata(){return {url:$('#publicationUrl')?.value||'',platform:$('#publicationPlatform')?.value||'Instagram',published_at:$('#publicationDate')?.value?new Date($('#publicationDate').value).toISOString():(state.publications?.[selected.id]?.metadata?.published_at||'')}}
function generationPanel(q){const g=q.generation,v=q.voice_selection,m=q.montage_review;if(!g&&!v&&!m)return '';return `<details><summary>Choix de production pour cette version</summary>${g?`<p><strong>Accroche retenue</strong> : ${esc(g.hooks[g.selected_hook].text)}</p><p>${esc(g.selection_reason)}</p><p>Raison de partager : ${esc(g.share_reason)}</p>${g.hooks.map((h,n)=>`<p>${n+1}. ${esc(h.text)}<br><small>Première image : ${esc(h.first_image)} · Chute : ${esc(h.payoff)}</small></p>`).join('')}`:''}${v?`<p><strong>${v.candidates.length} prises comparées</strong> · ${esc(v.reason)}</p><p>${esc(v.raccord_review)}</p>${v.candidates.map((c,n)=>`<p>Prise ${n+1}${c.sha256===v.selected_sha256?' · retenue':''} · ${c.review_method==='audio_listening'?'Écoute déclarée':'Contrôle du signal et de la transcription'}<br>${esc(c.observations.naturalness)} ${esc(c.limitations||'')}<br><audio controls preload="none" src="${file(c.file_path)}"></audio></p>`).join('')}`:''}${m?`<p><strong>Revue du montage</strong> · ${esc(m.coverage)}</p><p>${esc(m.comparison)}</p><p>${esc(m.limitations||'')}</p>${m.shots.map((r,n)=>`<p>Plan ${n+1} · ${esc(r.purpose)}<br><small>${esc(r.duration_reason)}</small></p>`).join('')}`:''}<p class="muted">Préparation de la proposition ; ta validation artistique reste distincte.</p></details>`}
function chainPanel(){
 const c=state.detail?.production_chain;if(!c)return '';
 const labels={context:'Contexte commun',photo_preflight:'Photos disponibles',direction:'Angle et récit',voice:'Proposition vocale',owner_voice:'Ton retour sur la voix',montage:'Montage',independent_review:'Revue indépendante',delivery:'Proposition livrée',owner_reel:'Ton retour sur le Reel',learning:'Enseignements'};
 if(!c.tasks?.length)return '<details><summary>Chaîne de production</summary><p>Le suivi commun sera créé lors de la prochaine demande. Les versions et validations existantes sont conservées.</p></details>';
 return `<details><summary>Chaîne de production · ${c.tasks.length} demande${c.tasks.length>1?'s':''}</summary><p>Contexte → photos → voix → ton accord → montage → revue indépendante → ton accord. Les étapes concernées dépendent de la demande.</p>${c.tasks.slice(-3).reverse().map(t=>`<section class="quiet-section"><p><strong>${esc(t.origin==='chat'?'Demande du chat':'Demande du studio')}</strong> · ${esc(new Date(t.created_at).toLocaleString('fr-FR'))}</p>${t.events.map(e=>`<p>${esc(labels[e.step]||e.step)}${e.step==='independent_review'?` · ${esc({pass:'prête pour ton avis',revise:'reprise demandée',blocked:'à débloquer'}[e.evidence.report?.verdict]||'')}<br><small>${esc(e.evidence.report?.summary||'')} ${esc(e.evidence.report?.limitations||'')}</small>`:e.evidence.decision?' · '+esc({keep:'validé',changes:'correction demandée',edited:'texte modifié'}[e.evidence.decision]||e.evidence.decision):''}</p>`).join('')}<p class="muted">${t.learning?.benchmark_hypotheses?.length||0} hypothèses de référence · ${t.learning?.production_observations?.length||0} observations antérieures. Elles ne remplacent pas tes consignes.</p></section>`).join('')}<p class="muted">L’avis automatique indique ses limites : les planches et mesures ne certifient pas une écoute ou un visionnage intégral.</p></details>`;
}
function performancePanel(a){const p=a.performance,rows=p?.records||a.metrics||[],labels={views:'Vues',reach:'Comptes touchés',saves:'Enregistrements',shares:'Partages',follows:'Abonnements attribués',average_watch_seconds:'Durée moyenne regardée (s)',retention_percent:'Rétention (%)'};return `<details><summary>Résultats à 24 h, 72 h et 7 jours</summary><p>Une valeur absente reste inconnue. Relevé manuel depuis les statistiques de la publication.</p>${(p?.checkpoints||[]).map(c=>`<p>${esc(c.label)} · ${c.recorded?'relevé enregistré':c.due_at?'à relever le '+esc(new Date(c.due_at).toLocaleString('fr-FR')):'date de publication à renseigner'}</p>`).join('')}${rows.map(r=>`<p>${esc(r.checkpoint)} · ${esc(new Date(r.observed_at).toLocaleString('fr-FR'))}${r.age_hours!=null?' · '+esc(r.age_hours)+' h après publication':''}<br>${Object.entries(r.metrics).map(([k,v])=>esc(labels[k]||k)+': '+esc(v??'inconnu')).join(' · ')}${r.rates?'<br>'+[['shares_per_1000_reached','Partages'],['saves_per_1000_reached','Enregistrements'],['follows_per_1000_reached','Abonnements']].map(([k,n])=>n+' / 1 000 comptes : '+esc(r.rates[k]??'inconnu')).join(' · '):''}<br>${esc(r.experiment?.hypothesis||r.hypothesis||'')} · ${esc(r.comment||'')}</p>`).join('')}<form id="performanceForm"><label for="checkpoint">Moment du relevé</label><select id="checkpoint"><option>J+1</option><option>J+3</option><option>J+7</option></select><label for="observedAt">Date et heure observées</label><input id="observedAt" type="datetime-local" required>${Object.entries(labels).map(([k,n])=>`<label for="metric-${k}">${n}</label><input id="metric-${k}" data-metric="${k}" type="number" min="0" ${k==='retention_percent'?'max="100"':''} step="any">`).join('')}<label for="metricSource">Origine du relevé</label><input id="metricSource" required placeholder="Statistiques Instagram…"><label for="experimentVariable">Un seul changement testé (facultatif)</label><select id="experimentVariable"><option value="">Aucun essai comparatif</option><option value="hook">Accroche</option><option value="ending">Conclusion</option><option value="voice">Interprétation vocale</option><option value="shot_timing">Durée des plans</option><option value="image_selection">Sélection des images</option></select><label for="experimentVariant">Variante testée</label><input id="experimentVariant" maxlength="1000"><label for="experimentCohort">Groupe de publications comparables</label><input id="experimentCohort" maxlength="1000" placeholder="Même série, sujets et durées proches…"><label for="hypothesis">Hypothèse à tester</label><textarea id="hypothesis"></textarea><label for="metricComment">Lecture qualitative et limites</label><textarea id="metricComment"></textarea><label for="metricDecision">Suite</label><select id="metricDecision"><option value="pending">À décider</option><option value="keep">Conserver</option><option value="adapt">Adapter</option><option value="abandon">Abandonner</option></select><button>Enregistrer le relevé</button></form><p class="muted">Comparer à âge, durée, sujet et audience comparables. Un résultat isolé ne prouve pas un effet causal.</p></details>`}
async function extraAction(path,payload,message){if(saving)return;saving=true;try{await postAction(path,payload);dirty=false;await load();notice(message)}catch(e){notice(e.message,true)}finally{saving=false}}
function bindExtras(){
 if($('#savePublicationMetadata'))$('#savePublicationMetadata').onclick=()=>extraAction('/api/publications',{run_id:selected.id,published:true,metadata:publicationMetadata()},'Informations de publication enregistrées.');
 const search=$('#search');if(search)search.oninput=()=>{const at=search.selectionStart;searchText=search.value;render();$('#search').focus();$('#search').setSelectionRange(at,at)};
 document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>extraAction('/api/tasks/retry',{id:b.dataset.retry},'Reprise enregistrée. Les fichiers existants seront réutilisés après vérification.'));
 document.querySelectorAll('[data-memory-id]').forEach(b=>b.onclick=()=>extraAction('/api/memory',{review_id:b.dataset.memoryId,scope:b.dataset.memoryScope==='off'?'auto':b.dataset.memoryScope,active:b.dataset.memoryScope!=='off'},'Portée de mémoire actualisée ; le retour original reste conservé.'));
 document.querySelectorAll('[data-priority]').forEach(b=>b.onclick=()=>togglePriority(b.dataset.priority));
 bindMediaPlayers();
 document.querySelectorAll('[data-compare]').forEach(b=>b.onclick=()=>switchPreview(b));
 if($('#qualitySection'))$('#qualitySection').onchange=()=>{const q=state.detail.quality,k=$('#qualitySection').value;const options=k==='editorial'?q.editorial_grid.map(r=>[r.id,r.question]):k==='facts'?q.facts.map(r=>[r.id,'Passage '+r.beat+' : '+r.claim]):k==='rights'?[['music','Musique et mode d’utilisation'],['images','Images et cadrages']]:[['images','Images et cadrages']];$('#qualityId').innerHTML=options.map(([id,label])=>`<option value="${esc(id)}">${esc(label)}</option>`).join('');dirty=true;rememberFields()};
 if($('#qualityForm'))$('#qualityForm').onsubmit=e=>{e.preventDefault();const q=state.detail.quality,section=$('#qualitySection').value,row={id:$('#qualityId').value,status:$('#qualityStatus').value,note:$('#qualityNote').value,source:$('#qualitySource').value,checked_at:$('#qualityDate').value};const entries=(q.annotations.sections?.[section]||[]).filter(r=>r.id!==row.id).concat(row);extraAction('/api/quality',{kind:selected.kind,target_id:selected.id,version:q.version,section,entries},'Contrôle conservé pour cette version précise.')};
 if($('#performanceForm'))$('#performanceForm').onsubmit=e=>{e.preventDefault();const metrics=Object.fromEntries([...document.querySelectorAll('[data-metric]')].map(e=>[e.dataset.metric,e.value===''?null:Number(e.value)]));extraAction('/api/performance',{run_id:selected.id,checkpoint:$('#checkpoint').value,observed_at:new Date($('#observedAt').value).toISOString(),metrics,experiment:$('#experimentVariable').value?{variable:$('#experimentVariable').value,variant:$('#experimentVariant').value,cohort:$('#experimentCohort').value,hypothesis:$('#hypothesis').value}:null,source:$('#metricSource').value,hypothesis:$('#hypothesis').value,comment:$('#metricComment').value,decision:$('#metricDecision').value},'Relevé enregistré ; les valeurs absentes restent inconnues.')};
 document.querySelectorAll('input:not([type=radio])').forEach(e=>{if(e.id!=='search'&&!e.id.startsWith('publication'))e.oninput=()=>{dirty=true;rememberFields()}});
}

window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});load().catch(e=>notice(e.message,true));
</script></body></html>
